<section class="editor-page">
  <header class="editor-header">
    <button type="button" class="back-button" (click)="goBack()">Volver</button>

    <div class="editor-title">
      <p class="eyebrow">ONLYOFFICE</p>
      <h1>Edicion colaborativa</h1>
      <p>{{ documentTitle() }}</p>
    </div>

    <span class="mode-badge">{{ modeLabel() }}</span>
  </header>

  @if (errorMessage()) {
    <div class="editor-feedback">
      <p>{{ errorMessage() }}</p>
      <div class="feedback-actions">
        <button type="button" (click)="retry()">Reintentar</button>
        <button type="button" (click)="refreshExpedient()">Actualizar expediente</button>
      </div>
    </div>
  } @else {
    <div class="editor-shell">
      @if (isLoading()) {
        <div class="editor-loading">
          <p>Cargando editor colaborativo...</p>
        </div>
      }

      <div id="onlyoffice-editor" class="onlyoffice-container"></div>
    </div>
  }
</section>
